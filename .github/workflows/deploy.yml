name: Deploy (prod)

# Build the production artifact. Runtime is managed by the Kubernetes
# manifest in server-deploy/kubernetes/us/personal/sys0.json.
# Do not redeploy the retired JP09 Portainer stack.
on:
  push:
    branches: [deploy/prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/fakecrowd/sys0-runtime

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export image
        run: docker save "${IMAGE}:latest" | gzip -1 > /tmp/sys0-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sys0-runtime-image
          path: /tmp/sys0-image.tar.gz
          retention-days: 1
          if-no-files-found: error
