name: Deploy (prod)

# GitOps deployment to jp09:
#   1. Build the runtime image and upload it as an ephemeral Actions artifact.
#   2. Load that image directly into Portainer endpoint 4.
#   3. Git-redeploy repository stack 48 (`sys0-jp09`) from the
#      private deployment repository without a registry pull.
on:
  push:
    branches: [deploy/prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/fakecrowd/sys0-runtime

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export image
        run: docker save "${IMAGE}:latest" | gzip -1 > /tmp/sys0-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sys0-runtime-image
          path: /tmp/sys0-image.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sys0-runtime-image
          path: /tmp/sys0-runtime-image
      - name: Load image into jp09
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_ORIGIN_IP: ${{ secrets.PORTAINER_ORIGIN_IP }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          ENDPOINT: "4"
        run: |
          set -euo pipefail
          host="${PORTAINER_URL#https://}"
          host="${host%%/*}"
          gzip -dc /tmp/sys0-runtime-image/sys0-image.tar.gz > /tmp/sys0-image.tar
          curl --fail --show-error --silent --http1.1 --noproxy '*' \
            --resolve "${host}:443:${PORTAINER_ORIGIN_IP}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H 'Content-Type: application/x-tar' \
            --data-binary @/tmp/sys0-image.tar \
            "${PORTAINER_URL}/api/endpoints/${ENDPOINT}/docker/images/load?quiet=1"
      - name: Deploy to jp09 via Portainer GitOps
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_ORIGIN_IP: ${{ secrets.PORTAINER_ORIGIN_IP }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          ENDPOINT: "4"
          STACK: "48"
          IMAGE: ghcr.io/fakecrowd/sys0-runtime
          SKIP_IMAGE_PULL: "1"
        run: |
          set -euo pipefail
          test -n "$PORTAINER_URL"
          test -n "$PORTAINER_ORIGIN_IP"
          test -n "$PORTAINER_API_KEY"
          test -n "$DEPLOY_REPO_TOKEN"
          python3 .github/scripts/portainer_deploy.py
