name: Deploy (prod)

# GitOps deployment to jp09:
#   1. Build and push ghcr.io/fakecrowd/sys0-runtime:{latest,version}.
#   2. Explicitly pull :latest on Portainer endpoint 4.
#   3. Git-redeploy repository stack 48 (`sys0-jp09`) from the
#      private deployment repository.
on:
  push:
    branches: [deploy/prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/fakecrowd/sys0-runtime

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
      - name: Publish container package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH /user/packages/container/sys0-runtime -f visibility=public

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to jp09 via Portainer GitOps
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_ORIGIN_IP: ${{ secrets.PORTAINER_ORIGIN_IP }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          ENDPOINT: "4"
          STACK: "48"
          IMAGE: ghcr.io/fakecrowd/sys0-runtime
        run: |
          set -euo pipefail
          test -n "$PORTAINER_URL"
          test -n "$PORTAINER_ORIGIN_IP"
          test -n "$PORTAINER_API_KEY"
          test -n "$DEPLOY_REPO_TOKEN"
          python3 .github/scripts/portainer_deploy.py
