name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  identity:
    name: identity boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_identity_leaks.py
      - run: python3 -m unittest discover -p '*_test.py'
        working-directory: .github/scripts

  # Build, vet and unit-test the Go code on all three OSes.
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1

  # Unit-test the rescue command policy and compile every rescue target.
  rescue:
    name: rescue (Zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Zig
        run: |
          set -e
          ZIG_VERSION=0.16.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
      - name: Test rescue policies
        run: |
          zig test sys0-rescue/src/install_policy_test.zig
          zig test sys0-rescue/src/progress_policy_test.zig
          zig test sys0-rescue/src/module_command_policy_test.zig
      - name: Enable Windows 7 compatibility in Zig stdlib
        run: python3 sys0-rescue/tools/patch_zig_win7.py "$HOME/zig/lib"
      - name: Cross-compile rescue
        run: |
          make -C sys0-rescue all ZIG=zig
          python3 sys0-rescue/tools/check_pe_win7_imports.py \
            sys0-rescue/dist/sys0-rescue_x86_64-windows.exe \
            sys0-rescue/dist/sys0-rescue_aarch64-windows.exe

  # Cross-compile the agent + hub for every release target.
  crosscompile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build all targets
        run: |
          set -e
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            export GOOS=${t%/*} GOARCH=${t#*/}
            echo "== $GOOS/$GOARCH =="
            go build -o /dev/null ./sys0-hub
            go build -o /dev/null ./sys0-agent
          done

  # Build the web console (catches TypeScript/Vite errors).
  web:
    name: web console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: sys0-console
      - run: npm run build
        working-directory: sys0-console

  # End-to-end smoke test against the real binaries (Linux).
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/e2e.sh
